<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSK Media 01</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: #222;
      text-align: center;
    }

    header {
      padding: 30px 20px;
      border-bottom: 1px solid #eee;
    }

    h1 {
      font-size: 36px;
      margin: 10px 0;
    }

    .hero {
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 32px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    section {
      padding: 40px 20px;
    }

    footer {
      margin-top: 30px;
      padding: 25px;
      border-top: 1px solid #eee;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>GSK Media 01</h1>
    <p>Official YouTube Channel Website</p>
  </header>

  <div class="hero">
    <h2>স্বাগতম GSK Media 01-এ</h2>
    <p>নতুন ভিডিও, গান ও আপডেট পেতে আমাদের সাথে থাকুন।</p>

    <a class="button" href="https://www.youtube.com/" target="_blank">
      YouTube Channel
    </a>
  </div>

  <section>
    <h2>আমাদের সম্পর্কে</h2>
    <p>GSK Media 01-এর অফিসিয়াল ওয়েবসাইটে আপনাকে স্বাগতম।</p>
  </section>

  <footer>
    © 2026 GSK Media 01
  </footer>

</body>
</html>
